name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check ddm_evals conftest.py tests/package

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ddm-evals info
      # Four frozen tests open absolute paths recorded in the hash-locked manifests under
      # results/research_directions: the author's checkout path and macOS's /private/tmp. The manifests and the
      # tests cannot be edited (their hashes are recorded in turn), so the runner recreates both paths as symlinks.
      - name: Recreate the absolute paths recorded in the frozen manifests
        run: |
          sudo mkdir -p /Users/aisuluomar/Downloads /private
          sudo ln -sfn "$GITHUB_WORKSPACE" /Users/aisuluomar/Downloads/ddm-evals
          sudo ln -sfn /tmp /private/tmp
      - run: python -m pytest -q
